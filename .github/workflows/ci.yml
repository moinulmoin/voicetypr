name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ===========================================
  # Change classification (workflow/docs fast path)
  # ===========================================
  changes:
    runs-on: ubuntu-latest
    outputs:
      application_required: ${{ steps.classify.outputs.application_required }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "application_required=true" >> "$GITHUB_OUTPUT"
            echo "No usable base commit; running application checks conservatively."
          else
            changed_files="$RUNNER_TEMP/voicetypr-changed-files"
            diff_range=("$BASE_SHA" "$HEAD_SHA")
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
              diff_range=("$BASE_SHA...$HEAD_SHA")
            fi
            if git diff --no-renames --name-only -z "${diff_range[@]}" > "$changed_files"; then
              node .github/scripts/classify-ci-changes.mjs --null < "$changed_files"
            else
              echo "application_required=true" >> "$GITHUB_OUTPUT"
              echo "Diff classification failed; running application checks conservatively."
            fi
          fi

  # ===========================================
  # Workflow contracts (fast, no dependency install)
  # ===========================================
  workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check workflow script syntax
        run: |
          for script in .github/scripts/*.mjs; do
            node --check "$script"
          done

      - name: Test workflow helper contracts
        run: node --test .github/scripts/*.node-test.mjs

      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

  # ===========================================
  # Frontend (fast - no Rust)
  # ===========================================
  frontend:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.application_required != 'false')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.19.0'
          package-manager-cache: false

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.13.1 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: TypeScript check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

  # ===========================================
  # Build macOS (full build = catches all issues)
  # ===========================================
  build-macos:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.application_required != 'false')
    strategy:
      matrix:
        include:
          - os: macos-14
            arch: aarch64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Select Swift 6 toolchain (Parakeet sidecar needs Xcode 16+)
        run: |
          xcode=$(ls -d /Applications/Xcode_1[6-9]*.app /Applications/Xcode_[2-9][0-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$xcode" ]; then echo "No Xcode >=16 (Swift 6) found on runner" >&2; exit 1; fi
          echo "Selecting $xcode"
          sudo xcode-select -s "$xcode"
          swift --version

      - name: Capture Swift toolchain cache key
        id: swift-toolchain
        run: echo "hash=$(swift --version | shasum -a 256 | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache Swift Parakeet build
        uses: actions/cache@v5
        with:
          path: sidecar/parakeet-swift/.build
          key: parakeet-swift-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift-toolchain.outputs.hash }}-${{ hashFiles('sidecar/parakeet-swift/Package.swift', 'sidecar/parakeet-swift/Package.resolved', 'sidecar/parakeet-swift/build.sh', 'sidecar/parakeet-swift/Sources/**') }}
          restore-keys: |
            parakeet-swift-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift-toolchain.outputs.hash }}-

      - name: Cache verified Apple Silicon FFmpeg sidecars
        uses: actions/cache@v5
        with:
          path: |
            sidecar/ffmpeg/dist/ffmpeg
            sidecar/ffmpeg/dist/ffprobe
            sidecar/ffmpeg/dist/ffmpeg-aarch64-apple-darwin
            sidecar/ffmpeg/dist/ffprobe-aarch64-apple-darwin
          key: ffmpeg-sidecars-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ensure-ffmpeg-sidecar.cjs') }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.19.0'
          package-manager-cache: false

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.13.1 --activate
          pnpm --version

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure FFmpeg sidecar
        run: pnpm run sidecar:ensure-ffmpeg

      - name: Build frontend
        run: pnpm build

      - name: Rust tests
        run: cd src-tauri && cargo test

      - name: Clippy
        run: cd src-tauri && cargo clippy -- -D warnings

      - name: Build Tauri (release)
        run: cd src-tauri && cargo build --release

      - name: Upload preview artifact
        uses: actions/upload-artifact@v6
        with:
          name: ci-macos-${{ matrix.arch }}-preview
          path: src-tauri/target/release/voicetypr
          retention-days: 30

  # Build Windows (CPU-safe app + Vulkan sidecar)
  # ===========================================
  build-windows:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.application_required != 'false')
    runs-on: windows-2022
    env:
      # Keep Windows paths short to avoid MSBuild/FileTracker failures on deep dependency trees.
      CARGO_TARGET_DIR: D:\b\app
      VULKAN_RUNTIME_VERSION: 1.3.290.0
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.19.0'
          package-manager-cache: false

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.13.1 --activate
          pnpm --version

      - name: Prepare cargo target dir
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:CARGO_TARGET_DIR | Out-Null

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-x64-build
          key: vulkan-${{ env.VULKAN_RUNTIME_VERSION }}
          workspaces: |
            src-tauri -> ../../../../b/app
            sidecar/whisper-vulkan -> ../../../../../b/vulkan

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.3.290.0
          install_runtime: true
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure FFmpeg sidecar
        run: pnpm run sidecar:ensure-ffmpeg

      - name: Build Whisper Vulkan sidecar
        shell: pwsh
        env:
          CARGO_TARGET_DIR: D:\b\vulkan
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --manifest-path sidecar/whisper-vulkan/Cargo.toml --release
          if ($LASTEXITCODE -ne 0) {
            throw "Whisper Vulkan sidecar build failed with exit code $LASTEXITCODE"
          }
          New-Item -ItemType Directory -Force -Path "sidecar/whisper-vulkan/dist" | Out-Null
          $targetDir = $env:CARGO_TARGET_DIR
          if ([string]::IsNullOrWhiteSpace($targetDir)) {
            $targetDir = "sidecar/whisper-vulkan/target"
          }
          $sidecarExe = Join-Path $targetDir "release/whisper-vulkan-sidecar.exe"
          if (-not (Test-Path $sidecarExe)) {
            throw "Whisper Vulkan sidecar binary not found: $sidecarExe"
          }
          Copy-Item $sidecarExe "sidecar/whisper-vulkan/dist/whisper-vulkan-sidecar-x86_64-pc-windows-msvc.exe"

      - name: Download Windows runtime installer resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/windows/resources" | Out-Null
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "src-tauri/windows/resources/vc_redist.x64.exe"
          $vulkanVersion = $env:VULKAN_RUNTIME_VERSION
          if ([string]::IsNullOrWhiteSpace($vulkanVersion)) {
            $vulkanVersion = $env:VULKAN_VERSION
          }
          if ([string]::IsNullOrWhiteSpace($vulkanVersion)) {
            $vulkanVersion = Split-Path -Leaf $env:VULKAN_SDK
          }
          if ([string]::IsNullOrWhiteSpace($vulkanVersion)) {
            throw "Cannot determine Vulkan version. Set VULKAN_RUNTIME_VERSION, VULKAN_VERSION, or VULKAN_SDK."
          }
          $vulkanRuntimeUrl = "https://sdk.lunarg.com/sdk/download/$vulkanVersion/windows/VulkanRT-$vulkanVersion-Installer.exe"
          Invoke-WebRequest -Uri $vulkanRuntimeUrl -OutFile "src-tauri/windows/resources/VulkanRT-Installer.exe"

      - name: Build frontend
        run: pnpm build

      - name: Rust tests (compile-only on Windows runner)
        run: cd src-tauri && cargo test --no-run

      - name: Build Tauri (release, CPU-safe main app)
        run: cd src-tauri && cargo build --release

      - name: Assert CPU build does not import vulkan-1.dll
        shell: pwsh
        run: |
          & ./src-tauri/windows/assert-no-vulkan-import.ps1 -ExePath "$env:CARGO_TARGET_DIR/release/voicetypr.exe"

      - name: Upload preview artifact
        uses: actions/upload-artifact@v6
        with:
          name: ci-windows-x64-preview
          path: D:/b/app/release/voicetypr.exe
          retention-days: 30
