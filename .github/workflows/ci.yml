name: CI

# A manual dispatch validates the selected ref; Intel is an explicit legacy lane.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      include_intel:
        description: 'Include the legacy Intel macOS lane'
        required: false
        default: false
        type: boolean
      use_depot:
        description: 'Use Depot for ARM macOS and Windows x64 (pilot)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ===========================================
  # Change classification (workflow/docs fast path)
  # ===========================================
  changes:
    runs-on: ubuntu-latest
    outputs:
      application_required: ${{ steps.classify.outputs.application_required }}
      native_required: ${{ steps.classify.outputs.native_required }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "application_required=true" >> "$GITHUB_OUTPUT"
            echo "native_required=true" >> "$GITHUB_OUTPUT"
            echo "No usable base commit; running application checks conservatively."
          else
            changed_files="$RUNNER_TEMP/voicetypr-changed-files"
            diff_range=("$BASE_SHA" "$HEAD_SHA")
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
              diff_range=("$BASE_SHA...$HEAD_SHA")
            fi
            if git diff --no-renames --name-only -z "${diff_range[@]}" > "$changed_files"; then
              node .github/scripts/classify-ci-changes.mjs --null < "$changed_files"
            else
              echo "application_required=true" >> "$GITHUB_OUTPUT"
              echo "native_required=true" >> "$GITHUB_OUTPUT"
              echo "Diff classification failed; running application checks conservatively."
            fi
          fi

  # ===========================================
  # Workflow contracts (fast, no dependency install)
  # ===========================================
  workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check workflow script syntax
        run: |
          for script in .github/scripts/*.mjs; do
            node --check "$script"
          done

      - name: Test workflow helper contracts
        run: node --test .github/scripts/*.node-test.mjs

      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

  # ===========================================
  # Frontend (fast - no Rust)
  # ===========================================
  frontend:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.application_required != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.19.0'
          package-manager-cache: false

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.13.1 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: TypeScript check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm exec vitest run src

      - name: Build frontend
        run: pnpm build

  # ===========================================
  # Native lanes (ARM macOS + Windows x64) via pinned trusted reusable workflow
  # ===========================================
  native:
    needs: [changes, workflow, frontend]
    if: >-
      ${{ !cancelled() &&
      needs.workflow.result == 'success' &&
      needs.frontend.result == 'success' &&
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) &&
      (needs.changes.result != 'success' || needs.changes.outputs.native_required != 'false') }}
    uses: ideaplexa/voicetypr/.github/workflows/native-ci.yml@a7cb868f0b7718633816aeab1bc454759d2cbd44
    with:
      use_depot: ${{ github.event_name == 'workflow_dispatch' && inputs.use_depot }}

  # ===========================================
  # Legacy Intel macOS lane (manual dispatch only; GitHub-hosted, never Depot)
  # ===========================================
  build-macos-intel:
    needs: [changes, workflow, frontend]
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
      inputs.include_intel == true &&
      !cancelled() &&
      needs.workflow.result == 'success' &&
      needs.frontend.result == 'success' &&
      (needs.changes.result != 'success' || needs.changes.outputs.native_required != 'false') }}
    runs-on: macos-15-intel
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Select Swift 6 toolchain and configure Clang runtime
        run: |
          xcode=$(
            find /Applications -maxdepth 1 \( -type d -o -type l \) \
              \( -name 'Xcode_1[6-9]*.app' -o -name 'Xcode_[2-9][0-9]*.app' \) \
              | sort -V \
              | tail -1
          )
          if [ -z "$xcode" ]; then echo "No Xcode >=16 (Swift 6) found on runner" >&2; exit 1; fi
          echo "Selecting $xcode"
          sudo xcode-select -s "$xcode"
          swift --version
          # Xcode 16.4 emits availability checks in whisper.cpp's Metal objects,
          # but Rust's final link does not automatically include compiler-rt.
          clang_runtime=$(xcrun --sdk macosx clang -print-libgcc-file-name)
          if [ ! -f "$clang_runtime" ]; then echo "Clang runtime not found: $clang_runtime" >&2; exit 1; fi
          echo "RUSTFLAGS=${RUSTFLAGS:+$RUSTFLAGS }-C link-arg=$clang_runtime" >> "$GITHUB_ENV"

      - name: Cache verified Apple Silicon FFmpeg sidecars
        uses: actions/cache@v5
        with:
          path: |
            sidecar/ffmpeg/dist/ffmpeg
            sidecar/ffmpeg/dist/ffprobe
            sidecar/ffmpeg/dist/ffmpeg-aarch64-apple-darwin
            sidecar/ffmpeg/dist/ffprobe-aarch64-apple-darwin
          key: ffmpeg-sidecars-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ensure-ffmpeg-sidecar.cjs') }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.19.0'
          package-manager-cache: false

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.13.1 --activate
          pnpm --version

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure FFmpeg sidecar
        run: pnpm run sidecar:ensure-ffmpeg

      - name: Build frontend
        run: pnpm build

      - name: Rust tests
        run: cd src-tauri && cargo test

      - name: Clippy
        run: cd src-tauri && cargo clippy -- -D warnings

      - name: Build Tauri (release)
        run: cd src-tauri && cargo build --release

      - name: Upload preview artifact
        uses: actions/upload-artifact@v6
        with:
          name: ci-macos-x86_64-preview
          path: src-tauri/target/release/voicetypr
          retention-days: 30
